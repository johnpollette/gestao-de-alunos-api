name: Testes de API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
   
    #Roda a cada 30 minutos
    - cron: '*/30 * * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/nova-gestao-de-alunos-test
      BASE_URL: http://127.0.0.1:3000
      ADMIN_EMAIL: admin@escola.com
      ADMIN_SENHA: admin123
      ALUNO_EMAIL: john.doe1@example.com
      ALUNO_SENHA: password123

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test

      - name: Iniciar API
        run: npm start > server.log 2>&1 &

      - name: Aguardar API
        run: curl --retry 30 --retry-all-errors --retry-delay 1 --fail http://localhost:3000/

      - name: Executar testes
        run: npm test